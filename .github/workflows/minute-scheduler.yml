name: Minute Scheduler

# Production minute due-tick without Vercel Pro cron.
# Calls formal /api/internal/scheduler/tick with SCHEDULER_CRON_SECRET (or CRON_SECRET compat).

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: minute-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: enqueue + worker drain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Due tick
        env:
          SCHEDULER_CRON_SECRET: ${{ secrets.SCHEDULER_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
        run: |
          set -euo pipefail
          SECRET="${SCHEDULER_CRON_SECRET:-}"
          if [ -z "$SECRET" ]; then
            SECRET="${CRON_SECRET:-}"
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::SCHEDULER_CRON_SECRET (or CRON_SECRET compat) is required"
            exit 1
          fi
          BASE_URL="${ATLAS_APP_URL:-}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::ATLAS_APP_URL secret is required (e.g. https://app.example.com)"
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            -H "x-request-id: gha-$(date -u +%Y%m%d%H%M%S)" \
            "${BASE_URL}/api/internal/scheduler/tick" \
            -o /tmp/tick.json
          echo "Tick response:"
          head -c 2000 /tmp/tick.json || true
          echo
