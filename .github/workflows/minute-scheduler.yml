name: Minute Scheduler

# Production minute due-tick without Vercel Pro cron.
# 1) Enqueue due occurrences (no heavy step work)
# 2) Drain worker leases independently
# Requires secrets: CRON_SECRET, ATLAS_APP_URL

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: minute-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enqueue:
    name: scheduler enqueue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Due tick (enqueue only)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is required"
            exit 1
          fi
          BASE_URL="${ATLAS_APP_URL:-}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::ATLAS_APP_URL secret is required (e.g. https://app.example.com)"
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE_URL}/api/automations/tick?drain=0" \
            -o /tmp/tick.json
          echo "Enqueue response:"
          head -c 2000 /tmp/tick.json || true
          echo

  drain:
    name: worker drain
    needs: enqueue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain leased jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${ATLAS_APP_URL%/}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE_URL}/api/worker/drain?limit=20" \
            -o /tmp/drain.json
          echo "Drain response:"
          head -c 2000 /tmp/drain.json || true
          echo
