name: Minute Scheduler

# Production minute due-tick without Vercel Pro cron.
# Calls /api/automations/tick with CRON_SECRET every minute.

on:
  schedule:
    # GitHub Actions cron is UTC and not realtime-guaranteed.
    # Duplicate/delayed ticks must stay idempotent via occurrenceKey claim.
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: minute-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: enqueue + worker drain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Due tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is required"
            exit 1
          fi
          BASE_URL="${ATLAS_APP_URL:-}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::ATLAS_APP_URL secret is required (e.g. https://app.example.com)"
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          # Prefer canonical Production host; warn if secret differs (no secret values printed).
          if [ "$BASE_URL" != "https://atlasapp.jp" ]; then
            echo "::warning::ATLAS_APP_URL is not https://atlasapp.jp — verify Production vs Preview mix-up"
          fi
          python3 - <<PY
          from urllib.parse import urlparse
          print("tick_target_host=" + urlparse("${BASE_URL}").netloc)
          PY
          # Self-heal: always re-apply idempotent work-queue DDL (CREATE OR REPLACE
          # claim/reclaim RPCs). Tables-only probe is insufficient — Production can
          # have tablesOk=true while claim RPC still uncapped (drain_1 pgCode 23514).
          WQ_CODE=$(curl -sS -o /tmp/wq-probe.json -w "%{http_code}" \
            "${BASE_URL}/api/health/work-queue?force=1" || echo "000")
          echo "work_queue_probe_http=${WQ_CODE}"
          python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/wq-probe.json"))
            print("work_queue_probe_safe=" + json.dumps({
              k: d.get(k) for k in (
                "ok","postgresUrlConfigured","tablesOk","storeReady",
                "developerCode","error","commitShaShort"
              ) if k in d
            }, ensure_ascii=False))
          except Exception:
            print("work_queue_probe_parse_error=true")
          PY
          echo "work_queue_apply_attempt=1"
          APPLY_CODE=$(curl -sS -o /tmp/wq-apply.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/health/work-queue?force=1&apply=1" || echo "000")
          echo "work_queue_apply_http=${APPLY_CODE}"
          python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/wq-apply.json"))
            print("work_queue_apply_safe=" + json.dumps({
              k: d.get(k) for k in (
                "ok","tablesOk","appliedViaPostgres","appliedViaManagementApi",
                "developerCode","error","commitShaShort"
              ) if k in d
            }, ensure_ascii=False))
          except Exception as e:
            print("work_queue_apply_parse_error=true")
          PY
          case "$APPLY_CODE" in
            200|202|204) ;;
            *)
              echo "::error::work-queue apply failed with HTTP ${APPLY_CODE}"
              exit 1
              ;;
          esac
          # P0-04: never dump full tick JSON (may contain userIds / job metadata).
          # Safe diagnostics only: ok / processed / developerCode / failedStage / postgres flags.
          HTTP_CODE=$(curl -sS -o /tmp/tick.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE_URL}/api/automations/tick")
          BYTES=$(wc -c < /tmp/tick.json | tr -d ' ')
          echo "tick_http_status=${HTTP_CODE}"
          echo "tick_body_bytes=${BYTES}"
          python3 - <<'PY'
          import json, sys
          try:
            d = json.load(open("/tmp/tick.json"))
          except Exception as e:
            print("tick_parse_error=true")
            sys.exit(0)
          safe_keys = [
            "ok",
            "processed",
            "error",
            "failedStage",
            "developerCode",
            "failureClass",
            "errorName",
            "pgCode",
            "substage",
            "retryable",
            "postgresUrlConfigured",
            "extendedPostgresUrlOnly",
            "skipped",
            "reason",
          ]
          print("tick_safe=" + json.dumps({k: d.get(k) for k in safe_keys if k in d}, ensure_ascii=False))
          wqf = d.get("workQueueFailure") if isinstance(d.get("workQueueFailure"), dict) else None
          if wqf is not None:
            print("tick_work_queue_failure=" + json.dumps({
              k: wqf.get(k) for k in (
                "failedStage","developerCode","failureClass","errorName",
                "pgCode","substage","retryable"
              ) if k in wqf
            }, ensure_ascii=False))
          # Nested safe counts only (no user identifiers).
          nr = d.get("notificationRetries") if isinstance(d.get("notificationRetries"), dict) else None
          if nr is not None:
            print("notification_retries=" + json.dumps({
              k: nr.get(k) for k in ("due","claimed","delivered","deadLettered","failed","dlqReinjected")
            }, ensure_ascii=False))
          em = d.get("externalMonitor") if isinstance(d.get("externalMonitor"), dict) else None
          if em is not None:
            print("external_monitor=" + json.dumps({
              k: em.get(k) for k in ("ok","openIncidents","deliveriesSent","resolvedThisCycle")
            }, ensure_ascii=False))
          PY
          rm -f /tmp/tick.json
          case "$HTTP_CODE" in
            200|202|204) ;;
            *)
              echo "::error::tick failed with HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
          # P2-03: horizontal worker fan-out via independent drain endpoint.
          # Tick already drains in-process with fan-out; this adds extra runners
          # so backlog clears even if a single tick invocation hits time limits.
          FANOUT=3
          echo "worker_horizontal_fanout=${FANOUT}"
          FAIL_DRAIN=0
          for i in $(seq 1 "$FANOUT"); do
            (
              # One workflow-level retry on 503 (retryable pool blip). Fatal 500 = fail.
              D_CODE="000"
              for attempt in 1 2; do
                D_CODE=$(curl -sS -o "/tmp/drain_${i}.json" -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  -H "Content-Type: application/json" \
                  "${BASE_URL}/api/worker/drain?workerId=gha_w_${i}&limit=20" || echo "000")
                echo "drain_${i}_http=${D_CODE}"
                if [ "$D_CODE" = "503" ] && [ "$attempt" = "1" ]; then
                  echo "drain_${i}_retryable_503=1"
                  sleep 1
                  continue
                fi
                break
              done
              python3 - <<PY
          import json
          try:
            d=json.load(open("/tmp/drain_${i}.json"))
            print("drain_${i}_safe=" + json.dumps({
              k: d.get(k) for k in (
                "ok","leased","completed","failed","workerId",
                "developerCode","failureClass","errorName","pgCode",
                "constraintName","substage","retryable"
              ) if k in d
            }, ensure_ascii=False))
          except Exception:
            print("drain_${i}_parse_error=true")
          PY
              case "$D_CODE" in
                200|202|204) ;;
                *) echo "drain_${i}_failed=1" > "/tmp/drain_${i}.fail" ;;
              esac
            ) &
          done
          wait
          for i in $(seq 1 "$FANOUT"); do
            if [ -f "/tmp/drain_${i}.fail" ]; then
              FAIL_DRAIN=1
            fi
          done
          rm -f /tmp/drain_*.json /tmp/drain_*.fail
          if [ "$FAIL_DRAIN" != "0" ]; then
            echo "::error::P2-03 horizontal drain fan-out failed (soft-success forbidden)"
            exit 1
          fi
          echo "worker_horizontal_fanout_ok=true"
