name: Apply Work Queue Migration (P1 tick)

# Prefer Production apply=1 with CRON_SECRET (Vercel already has DATABASE_URL).
# Always re-apply idempotent DDL so claim/reclaim RPCs stay current even when
# tablesOk=true (Production evidence: uncapped claim RPC → drain_1 pgCode 23514).
# Fall back to Actions DATABASE_URL / Supabase Management API when present.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260802_atlas_work_queue.sql"
      - "supabase/migrations/20260804_p0_2_durable_job_claim.sql"
      - "supabase/migrations/20260812_work_queue_claim_attempt_cap.sql"
      - "lib/work-queue/migration-sql.ts"
      - "app/api/health/work-queue/**"
      - ".github/workflows/apply-work-queue-migration.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply work-queue schema (Production apply=1 preferred)
        env:
          PROD_URL: https://atlasapp.jp
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          probe_ok() {
            CODE=$(curl -sS -o /tmp/wq-probe.json -w "%{http_code}" \
              "$PROD_URL/api/health/work-queue?force=1" || echo "000")
            echo "probe_http=$CODE"
            python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/wq-probe.json"))
          print({k:d.get(k) for k in [
            "ok","postgresUrlConfigured","tablesOk","metricsOk",
            "storeReady","developerCode","error","commitShaShort"
          ]})
          sys.exit(0 if d.get("ok") is True and d.get("tablesOk") is True else 1)
          PY
          }

          SQL_FILES=(
            "supabase/migrations/20260802_atlas_work_queue.sql"
            "supabase/migrations/20260804_p0_2_durable_job_claim.sql"
            "supabase/migrations/20260812_work_queue_claim_attempt_cap.sql"
          )

          # 1) Production apply via CRON_SECRET (uses deployed ATLAS_WORK_QUEUE_MIGRATION_SQL)
          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Attempting Production apply=1 with CRON_SECRET"
            APPLY_CODE=$(curl -sS -o /tmp/wq-apply.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$PROD_URL/api/health/work-queue?force=1&apply=1" || echo "000")
            echo "apply_http=$APPLY_CODE"
            python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/wq-apply.json"))
            print({k:d.get(k) for k in [
              "ok","tablesOk","appliedViaPostgres","appliedViaManagementApi",
              "developerCode","error","commitShaShort"
            ]})
          except Exception as e:
            print("apply_parse", e)
          PY
            case "$APPLY_CODE" in
              200|202|204)
                if probe_ok; then
                  echo "work_queue_ready_via_production_apply=true"
                  exit 0
                fi
                ;;
            esac
          else
            echo "::warning::CRON_SECRET not set — cannot call Production apply=1"
          fi

          # 2) Direct psql from Actions secrets
          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${SUPABASE_DB_URL:-}" ]; then
            CONN="${DATABASE_URL:-${POSTGRES_URL:-$SUPABASE_DB_URL}}"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            for f in "${SQL_FILES[@]}"; do
              echo "Applying via psql: $f"
              psql "$CONN" -v ON_ERROR_STOP=1 -f "$f"
            done
            if probe_ok; then
              echo "work_queue_ready_via_psql=true"
              exit 0
            fi
          fi

          # 3) Supabase Management API
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            for f in "${SQL_FILES[@]}"; do
              BODY=$(python3 - <<PY
          import json, pathlib
          print(json.dumps({"query": pathlib.Path("$f").read_text()}))
          PY
          )
              RESP=$(curl -sS -w "\n%{http_code}" \
                -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$BODY")
              CODE=$(echo "$RESP" | tail -n1)
              echo "management_api_status=$CODE file=$f"
              test "$CODE" = "200" -o "$CODE" = "201"
            done
            if probe_ok; then
              echo "work_queue_ready_via_management_api=true"
              exit 0
            fi
          fi

          # If tables already healthy but apply paths unavailable, do not fail the
          # gate — Minute Scheduler always-apply refreshes claim RPC post-deploy.
          if probe_ok; then
            echo "::warning::work_queue tablesOk but claim RPC refresh may await Minute Scheduler apply"
            echo "work_queue_tables_ok_pending_rpc_refresh=true"
            exit 0
          fi

          echo "::error::Work-queue schema still missing after apply attempts."
          echo "::error::Owner: run Supabase SQL Editor (20260802 + 20260804 + 20260812) OR"
          echo "::error::curl -H \"Authorization: Bearer \$CRON_SECRET\" \"https://atlasapp.jp/api/health/work-queue?apply=1&force=1\""
          exit 1
