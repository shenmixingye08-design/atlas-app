name: Apply Automation V2 DB SoT Migration (P1-03)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260801_atlas_automations_v2.sql"
      - "supabase/migrations/20260808_p1_03_automation_v2_db_sot.sql"
      - "lib/automation-platform/repository/migration-sql.ts"
      - ".github/workflows/apply-automation-v2-db-sot-migration.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Automation V2 DB SoT SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          SQL_BASE="supabase/migrations/20260801_atlas_automations_v2.sql"
          SQL_P103="supabase/migrations/20260808_p1_03_automation_v2_db_sot.sql"

          apply_psql() {
            local file="$1"
            echo "Applying via psql: $file"
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$file"
          }

          apply_management() {
            local file="$1"
            BODY=$(python3 - <<PY
          import json, pathlib
          sql = pathlib.Path("$file").read_text()
          print(json.dumps({"query": sql}))
          PY
          )
            RESP=$(curl -sS -w "\n%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            CODE=$(echo "$RESP" | tail -n1)
            BODY_OUT=$(echo "$RESP" | sed '$d')
            BYTES=$(printf '%s' "$BODY_OUT" | wc -c | tr -d ' ')
            echo "management_api_status=$CODE body_bytes=$BYTES file=$file"
            test "$CODE" = "200" -o "$CODE" = "201"
          }

          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${SUPABASE_DB_URL:-}" ]; then
            CONN="${DATABASE_URL:-${POSTGRES_URL:-$SUPABASE_DB_URL}}"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            apply_psql "$SQL_BASE"
            apply_psql "$SQL_P103"
            echo "Applied automation V2 DB SoT schema via psql"
            exit 0
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::P1-03: automation V2 DDL credentials missing."
            echo "::error::Set GitHub Actions secrets DATABASE_URL (or POSTGRES_URL) OR SUPABASE_ACCESS_TOKEN+SUPABASE_PROJECT_REF,"
            echo "::error::OR apply supabase/migrations/20260801_atlas_automations_v2.sql and"
            echo "::error::supabase/migrations/20260808_p1_03_automation_v2_db_sot.sql in Supabase SQL Editor,"
            echo "::error::then confirm https://atlasapp.jp/api/health/automation-v2-db shows ok=true."
            exit 1
          fi

          apply_management "$SQL_BASE"
          apply_management "$SQL_P103"
          echo "Applied automation V2 DB SoT schema via Management API"
