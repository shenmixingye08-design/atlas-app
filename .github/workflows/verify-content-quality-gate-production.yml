# P2-02 Production content quality gate proof.
name: Verify Content Quality Gate Production (P2-02)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/deliverables/content-quality.ts"
      - "lib/deliverables/content-quality-gate-probe.ts"
      - "lib/deliverables/engine.ts"
      - "lib/deliverables/p2-02-nonword-quality-gate.test.ts"
      - "app/api/health/content-quality-gate/**"
      - "scripts/ci/p2-02-nonword-quality-gate-ban.mjs"
      - ".github/workflows/verify-content-quality-gate-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production content-quality-gate
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"
          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          READY=""
          for i in $(seq 1 24); do
            curl -sS -o /tmp/p202.json "${PROD_URL}/api/health/content-quality-gate?force=1" || true
            PROD_SHA="$(python3 -c 'import json;d=json.load(open("/tmp/p202.json"));print(d.get("commitShaShort") or "")' 2>/dev/null || true)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            # Endpoint may 401 until deploy; keep waiting when app code changed.
            sleep 15
          done
          if [ -z "${READY}" ]; then
            echo "::error::Production content-quality-gate not ready. Soft-success forbidden."
            exit 1
          fi

          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/p202.json"))
          print({k:d.get(k) for k in [
            "ok","commonGateOk","nonWordFormatsGated","formatSpecificOk",
            "engineNonWordPathGated","failClosedOnGarbage","memoryNotSot",
            "multiInstanceSafe","commitShaShort","error"
          ]})
          failures=[]
          for k in ("ok","commonGateOk","nonWordFormatsGated","formatSpecificOk",
                    "engineNonWordPathGated","failClosedOnGarbage","memoryNotSot",
                    "multiInstanceSafe"):
            if d.get(k) is not True:
              failures.append(f"{k}!=true")
          if failures:
            print("::error::P2-02 Production content-quality-gate failed:", ", ".join(failures))
            sys.exit(1)
          print("p2_02_production_content_quality_gate=pass")
          PY
