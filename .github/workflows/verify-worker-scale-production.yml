# P2-03 Production worker horizontal scale proof.
name: Verify Worker Scale Production (P2-03)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/work-queue/worker-scale.ts"
      - "lib/work-queue/worker-scale-probe.ts"
      - "lib/work-queue/tick.ts"
      - "lib/work-queue/constants.ts"
      - "lib/work-queue/p2-03-worker-scale.test.ts"
      - "app/api/health/worker-scale/**"
      - "scripts/ci/p2-03-worker-scale-ban.mjs"
      - ".github/workflows/minute-scheduler.yml"
      - ".github/workflows/verify-worker-scale-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production worker-scale
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"
          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          READY=""
          for i in $(seq 1 30); do
            curl -sS -o /tmp/p203.json "${PROD_URL}/api/health/worker-scale?force=1" || true
            PROD_SHA="$(python3 -c 'import json;d=json.load(open("/tmp/p203.json"));print(d.get("commitShaShort") or "")' 2>/dev/null || true)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            sleep 15
          done
          if [ -z "${READY}" ]; then
            echo "::error::Production worker-scale not ready. Soft-success forbidden."
            exit 1
          fi

          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/p203.json"))
          print({k:d.get(k) for k in [
            "ok","minutePathPresent","claimLimitReviewed","horizontalDrainWired",
            "backpressureConfigured","multiWorkerLeaseOk","horizontalDrainOk",
            "memoryNotSot","multiInstanceSafe","failClosedUnauthorized",
            "fanOutDefault","claimBatch","commitShaShort","error"
          ]})
          failures=[]
          for k in ("ok","minutePathPresent","claimLimitReviewed","horizontalDrainWired",
                    "backpressureConfigured","multiWorkerLeaseOk","horizontalDrainOk",
                    "memoryNotSot","multiInstanceSafe","failClosedUnauthorized"):
            if d.get(k) is not True:
              failures.append(f"{k}!=true")
          if isinstance(d.get("claimBatch"), int) and not (d["claimBatch"] > 10):
            failures.append("claimBatch<=10")
          if isinstance(d.get("fanOutDefault"), int) and not (d["fanOutDefault"] >= 2):
            failures.append("fanOutDefault<2")
          if failures:
            print("::error::P2-03 Production worker-scale failed:", ", ".join(failures))
            sys.exit(1)
          print("p2_03_production_worker_scale=pass")
          PY
