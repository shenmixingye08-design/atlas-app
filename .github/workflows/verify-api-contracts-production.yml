# P2-01 Production API contract smoke.
name: Verify API Contracts Production (P2-01)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this Production contract smoke is being run"
        required: false
        default: "P2-01 API contract proof"
  push:
    branches: [main]
    paths:
      - "lib/api-contracts/**"
      - "app/api/health/api-contracts/**"
      - "scripts/ci/p2-01-api-contract-smoke.mjs"
      - "scripts/ci/p2-01-api-contract-smoke-paths.mjs"
      - "scripts/ci/p2-01-api-contract-ban.mjs"
      - ".github/workflows/verify-api-contracts-production.yml"

permissions:
  contents: read

jobs:
  verify-production-contracts:
    name: Production API contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Production deploy + smoke contracts
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"

          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          echo "Waiting for Production deploy readiness (max ~6m)..."
          READY=""
          for i in $(seq 1 24); do
            curl -sS -o /tmp/p201-version.json "${PROD_URL}/api/health/version" || true
            PROD_SHA="$(
              python3 -c 'import json; d=json.load(open("/tmp/p201-version.json")); print(d.get("commitShaShort") or "")' 2>/dev/null || true
            )"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            sleep 15
          done

          if [ -z "${READY}" ]; then
            echo "::error::Production deploy not ready for P2-01 smoke. Soft-success forbidden."
            exit 1
          fi

          chmod +x scripts/ci/p2-01-api-contract-smoke.mjs
          node scripts/ci/p2-01-api-contract-smoke.mjs
