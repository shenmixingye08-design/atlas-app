name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Install PDF QA tools (poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: V2 stub-ban / Production registry gate
        run: node scripts/ci/v2-stub-ban.mjs

      - name: P0-2 durable job claim ban
        run: node scripts/ci/p0-2-job-claim-ban.mjs

      - name: P0-3 durable deliverable artifact ban
        run: node scripts/ci/p0-3-deliverable-artifact-ban.mjs

      - name: P0-4 durable notification inbox ban
        run: node scripts/ci/p0-4-notification-inbox-ban.mjs

      - name: P1-01 PDF table render fail-closed ban
        run: node scripts/ci/p1-01-pdf-table-ban.mjs

      - name: P1-08 deliverable practical quality ban
        run: node scripts/ci/p1-08-deliverable-quality-ban.mjs

      - name: P1-02 notification retry → automation tick ban
        run: node scripts/ci/p1-02-notification-retry-tick-ban.mjs

      - name: P1-09 reliability fabrication ban
        run: node scripts/ci/p1-09-reliability-fabrication-ban.mjs

      - name: P1-07 external monitor / alert integrity ban
        run: node scripts/ci/p1-07-external-monitor-ban.mjs

      - name: P2-01 API contract ban
        run: node scripts/ci/p2-01-api-contract-ban.mjs

      - name: P2-02 non-Word quality gate ban
        run: node scripts/ci/p2-02-nonword-quality-gate-ban.mjs

      - name: P2-03 worker horizontal scale ban
        run: node scripts/ci/p2-03-worker-scale-ban.mjs

      - name: P2-04 structured logs ban
        run: node scripts/ci/p2-04-structured-logs-ban.mjs

      - name: P2-05 OCR engine evaluation ban
        run: node scripts/ci/p2-05-ocr-engine-ban.mjs

      - name: P3-01 JWT連携RLS ban
        run: node scripts/ci/p3-01-jwt-rls-ban.mjs

      - name: P3-02 Company template tenant isolation ban
        run: node scripts/ci/p3-02-company-template-tenant-ban.mjs

      - name: P3-03 Advanced Excel ban
        run: node scripts/ci/p3-03-advanced-excel-ban.mjs

      - name: P3-04 PPTX design templates ban
        run: node scripts/ci/p3-04-pptx-design-ban.mjs

      - name: N-01 Premium capability honesty ban
        run: node scripts/ci/n01-premium-capability-ban.mjs

      - name: N-02 Unproven speed claims ban
        run: node scripts/ci/n02-unproven-speed-claims-ban.mjs

      - name: N-05 Memory apply production ban
        run: node scripts/ci/n05-memory-apply-ban.mjs

      - name: N-08 Automation canonical unify ban
        run: node scripts/ci/n08-automation-unify-ban.mjs

      - name: N-07 Soft-success elimination ban
        run: node scripts/ci/n07-soft-success-ban.mjs

      - name: N-04 Notion/YouTube stub exposure ban
        run: node scripts/ci/n04-stub-exposure-ban.mjs

      - name: P0-5 durable X scheduled posts ban
        run: node scripts/ci/p0-5-x-scheduled-posts-ban.mjs

      - name: P0-6 durable automation engine ban
        run: node scripts/ci/p0-6-durable-automation-ban.mjs

      - name: P0-7 document generation pipeline ban
        run: node scripts/ci/p0-7-document-pipeline-ban.mjs

      - name: Unit / integration tests
        run: npm test
        env:
          # Keep tests deterministic; do not enable mock-success shortcuts.
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          # Vitest workers serialize large fixtures; default heap OOMs on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Work-queue critical path
        run: npm test -- --run lib/work-queue lib/automations/durable.test.ts
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P2-01 API contracts
        run: npm run test:api-contracts
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P2-02 content quality gate
        run: npm run test:content-quality-gate
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P2-03 worker scale
        run: npm run test:worker-scale
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P2-04 structured logs
        run: npm run test:structured-logs
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P2-05 OCR engine evaluation
        run: npm run test:ocr-engine
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P3-01 JWT連携RLS
        run: npm run test:jwt-rls
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P3-02 Company template tenant isolation
        run: npm run test:company-template
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P3-03 Advanced Excel
        run: npm run test:excel-advanced
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: P3-04 PPTX design templates
        run: npm run test:pptx-design
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-01 Premium capability honesty
        run: npm run test:plan-capability
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-02 Unproven speed claims
        run: npm run test:unproven-speed-claims
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-05 Memory apply production
        run: npm run test:memory-apply
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-08 Automation canonical unify
        run: npm run test:n08-automation-unify
        env:
          TZ: UTC
          ATLAS_AUTOMATION_STORAGE: "memory_durable"
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-07 Soft-success elimination
        run: npm run test:n07-soft-success
        env:
          TZ: UTC
          ATLAS_NOTIFICATION_STORAGE: "memory_durable"
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: N-04 Notion/YouTube stub exposure
        run: npm run test:n04-stub-exposure
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload Vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: |
            **/vitest*.log
            /tmp/vitest*
            /tmp/atlas*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (unconditional — no owner/screenshot secrets)
        run: npm run build
        env:
          # CI build must succeed without production secrets.
          # Runtime remains fail-closed for missing Clerk/owner config.
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Next.js build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-logs
          path: |
            .next/diagnostics/**
            .next/trace
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "## Quality Gate failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more of typecheck / lint / test / build failed." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is a required merge gate for main." >> "$GITHUB_STEP_SUMMARY"
