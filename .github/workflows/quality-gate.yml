name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_work_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_work_queue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Install PDF QA tools (poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: V2 stub-ban / Production registry gate
        run: node scripts/ci/v2-stub-ban.mjs

      - name: Work-queue durability ban
        run: node scripts/ci/work-queue-durability-ban.mjs

      - name: Cron SoT consistency
        run: node scripts/ci/assert-cron-sot.mjs

      - name: Memory share SoT gate
        run: node scripts/ci/assert-memory-share.mjs

      - name: Apply work-queue Postgres migrations (CI service)
        env:
          DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/atlas_work_queue
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          chmod +x scripts/ci/apply-work-queue-migrations.sh
          ./scripts/ci/apply-work-queue-migrations.sh

      - name: Unit / integration tests
        run: npm test
        env:
          # Keep tests deterministic; do not enable mock-success shortcuts.
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          # Vitest workers serialize large fixtures; default heap OOMs on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Work-queue critical path + 100 consecutive proof
        run: npm test -- --run lib/work-queue lib/automations/durable.test.ts
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload scheduler-100-proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-100-proof
          path: |
            artifacts/scheduler-production/scheduler-100-proof.json
            /opt/cursor/artifacts/scheduler-production/scheduler-100-proof.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Work-queue Postgres durability
        run: npm test -- --run lib/work-queue/postgres-durability.test.ts
        env:
          TZ: UTC
          DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/atlas_work_queue
          ATLAS_WORK_QUEUE_FORCE_FILE: "false"
          VITEST: ""
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Memory share Phase2 proof
        run: npm test -- --run lib/memory-apply/memory-apply.test.ts
        env:
          TZ: UTC
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload memory-share-proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-share-proof
          path: |
            artifacts/memory-share/memory-share-proof.json
            /opt/cursor/artifacts/memory-share/memory-share-proof.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Durability Blocker #4 proof
        run: npm test -- --run lib/work-queue/blocker4-durability.test.ts
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload durability-blocker4-proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durability-blocker4-proof
          path: |
            artifacts/durability-blocker4/durability-proof.json
            /opt/cursor/artifacts/durability-blocker4/durability-proof.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: |
            **/vitest*.log
            /tmp/vitest*
            /tmp/atlas*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (unconditional — no owner/screenshot secrets)
        run: npm run build
        env:
          # CI build must succeed without production secrets.
          # Runtime remains fail-closed for missing Clerk/owner config.
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Next.js build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-logs
          path: |
            .next/diagnostics/**
            .next/trace
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "## Quality Gate failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more of typecheck / lint / test / build failed." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is a required merge gate for main." >> "$GITHUB_STEP_SUMMARY"
