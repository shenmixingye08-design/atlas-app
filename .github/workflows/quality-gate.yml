name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Install PDF QA tools (poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: V2 stub-ban / Production registry gate
        run: node scripts/ci/v2-stub-ban.mjs

      - name: Phase 3-1 external adapter audit tests + artifacts
        run: npm test -- --run lib/integrations/audit
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: External adapter audit CI gate
        run: node scripts/ci/external-adapter-audit.mjs

      - name: Upload Phase 3-1 external adapter audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: external-adapter-audit
          path: |
            artifacts/external-adapter-inventory.json
            artifacts/integration-registry-audit.json
            artifacts/oauth-security-audit.json
            artifacts/token-storage-audit.json
            artifacts/integration-risk-register.json
            docs/development/phase-3-2-targets.md
          if-no-files-found: error
          retention-days: 30

      - name: Unit / integration tests
        run: npm test
        env:
          # Keep tests deterministic; do not enable mock-success shortcuts.
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          # Vitest workers serialize large fixtures; default heap OOMs on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Work-queue critical path
        run: npm test -- --run lib/work-queue lib/automations/durable.test.ts
        env:
          TZ: UTC
          ATLAS_WORK_QUEUE_FORCE_FILE: "true"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload Vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: |
            **/vitest*.log
            /tmp/vitest*
            /tmp/atlas*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (unconditional — no owner/screenshot secrets)
        run: npm run build
        env:
          # CI build must succeed without production secrets.
          # Runtime remains fail-closed for missing Clerk/owner config.
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Next.js build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-logs
          path: |
            .next/diagnostics/**
            .next/trace
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "## Quality Gate failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more of typecheck / lint / test / build failed." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is a required merge gate for main." >> "$GITHUB_STEP_SUMMARY"
