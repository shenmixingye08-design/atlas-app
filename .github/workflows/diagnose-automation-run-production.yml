# Production Automation V2 run diagnostic via DB secrets in Actions.
#
# 2026-08-12: post-#295 「承認して実行」不可は deploy lag（prod=76f5524,
# #295=cb7124c 未反映）。必ず /api/health/version の commitShaShort を先に確認。
name: Diagnose Automation Run Production

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Automation run id (requestId from failure view)
        required: false
        type: string
        default: ""
      diagnostic_id:
        description: diagnosticId from failure view
        required: false
        type: string
        default: ""
  push:
    branches: [main, "cursor/**"]
    paths:
      - "scripts/ci/diagnose-automation-run-production.mjs"
      - ".github/workflows/diagnose-automation-run-production.yml"
      - "app/api/health/automation-run-diagnose/**"
      - "lib/auth/public-routes.ts"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose via Production health (CRON_SECRET)
        id: health_diagnose
        env:
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          export ATLAS_APP_URL="${ATLAS_APP_URL:-https://atlasapp.jp}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "health_diagnose=skip_no_cron_secret"
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prefer explicit ids; otherwise scan latest Phase 2 Calendar success.
          if [ -n "${DIAGNOSE_REQUEST_ID:-}${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then
            QS="force=1"
            if [ -n "${DIAGNOSE_REQUEST_ID:-}" ]; then QS="${QS}&requestId=${DIAGNOSE_REQUEST_ID}"; fi
            if [ -n "${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then QS="${QS}&diagnosticId=${DIAGNOSE_DIAGNOSTIC_ID}"; fi
          else
            QS="force=1&phase2CalendarSuccess=1"
          fi

          # Try Production first; if Clerk-blocked/old binary, fall back to this
          # commit's Vercel Preview (same Supabase SoT, new diagnose code).
          BASES=("${ATLAS_APP_URL}")
          PREVIEW_URL="$(python3 - <<'PY'
import json, os, urllib.request
sha = os.environ.get("GITHUB_SHA", "")
token = os.environ.get("GITHUB_TOKEN", "")
repo = os.environ.get("GITHUB_REPOSITORY", "")
if not (sha and token and repo):
    raise SystemExit(0)
req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/deployments?environment=Preview&per_page=20",
    headers={
        "Authorization": f"Bearer {token}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "atlas-phase2-diagnose",
    },
)
with urllib.request.urlopen(req, timeout=30) as resp:
    rows = json.load(resp)
for row in rows:
    if not str(row.get("sha", "")).startswith(sha[:7]):
        continue
    # statuses URL → find vercel preview environment_url
    st_url = row.get("statuses_url")
    if not st_url:
        continue
    st_req = urllib.request.Request(
        st_url,
        headers={
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "atlas-phase2-diagnose",
        },
    )
    with urllib.request.urlopen(st_req, timeout=30) as st_resp:
        statuses = json.load(st_resp)
    for st in statuses:
        env_url = st.get("environment_url") or st.get("target_url") or ""
        if "vercel.app" in env_url:
            print(env_url.rstrip("/"))
            raise SystemExit(0)
PY
)" || true
          if [ -n "${PREVIEW_URL:-}" ]; then
            echo "preview_url=${PREVIEW_URL}"
            BASES+=("${PREVIEW_URL}")
          fi

          health_ok=0
          for BASE in "${BASES[@]}"; do
            echo "diagnose_base=${BASE}"
            code=$(curl -sS -o "${DIAGNOSE_OUT}/health-diagnose.json" -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Cache-Control: no-store" \
              "${BASE}/api/health/automation-run-diagnose?${QS}" || true)
            echo "health_http=${code} base=${BASE}"
            echo "health_http=${code}" >> "$GITHUB_OUTPUT"
            if [ "${code}" = "200" ]; then
              health_ok=1
              echo "health_ok=1" >> "$GITHUB_OUTPUT"
              python3 - <<'PY'
          import json
          d=json.load(open("/home/runner/work/_temp/diagnose-automation-run/health-diagnose.json"))
          run=d.get("run") or {}
          auto=d.get("automation") or {}
          derived=d.get("derived") or {}
          print(json.dumps({
            "ok": d.get("ok"),
            "lookup": d.get("lookup"),
            "automationId": run.get("automationId") or auto.get("id"),
            "runId": run.get("id"),
            "occurrenceKey": run.get("scheduleOccurrenceKey"),
            "status": run.get("status"),
            "approvalStatus": run.get("approvalStatus"),
            "googleCalendarStepStatus": run.get("googleCalendarStepStatus"),
            "googleCalendarEventIds": run.get("googleCalendarEventIds"),
            "externalActionIds": run.get("externalActionIds"),
            "completionEvidence": run.get("completionEvidence"),
            "transitionReasons": run.get("transitionReasons"),
            "startedAt": run.get("startedAt"),
            "completedAt": run.get("completedAt"),
            "freeformNotesPreview": auto.get("freeformNotesPreview"),
            "hasGoogleCalendarStep": auto.get("hasGoogleCalendarStep"),
            "enabledStepTypes": auto.get("enabledStepTypes"),
            "derived": derived,
            "resultSummary": run.get("resultSummary"),
          }, ensure_ascii=False, indent=2))
          PY
              break
            fi
          done
          if [ "${health_ok}" != "1" ]; then
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            head -c 800 "${DIAGNOSE_OUT}/health-diagnose.json" || true
          fi

      - name: Diagnose automation run from Production DB
        if: steps.health_diagnose.outputs.health_ok != '1' && (github.event.inputs.request_id != '' || github.event.inputs.diagnostic_id != '')
        env:
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          if [ -z "${DIAGNOSE_REQUEST_ID:-}${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then
            echo "::error::request_id or diagnostic_id required"
            exit 2
          fi
          node scripts/ci/diagnose-automation-run-production.mjs

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-automation-run
          path: ${{ runner.temp }}/diagnose-automation-run/
          if-no-files-found: warn
