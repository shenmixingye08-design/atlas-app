# Production Automation V2 run diagnostic via DB secrets in Actions.
name: Diagnose Automation Run Production

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Automation run id (requestId from failure view)
        required: false
        type: string
        default: ""
      diagnostic_id:
        description: diagnosticId from failure view
        required: false
        type: string
        default: ""
  push:
    branches: [main, "cursor/**"]
    paths:
      - "scripts/ci/diagnose-automation-run-production.mjs"
      - ".github/workflows/diagnose-automation-run-production.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose via Production health (CRON_SECRET)
        id: health_diagnose
        env:
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '93e8885c-1328-4800-9332-3ec2aa1019ef' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '892cb451-62a2-4ea2-9a72-49cab5d67d04' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          export ATLAS_APP_URL="${ATLAS_APP_URL:-https://atlasapp.jp}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "health_diagnose=skip_no_cron_secret"
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QS="force=1"
          if [ -n "${DIAGNOSE_REQUEST_ID:-}" ]; then QS="${QS}&requestId=${DIAGNOSE_REQUEST_ID}"; fi
          if [ -n "${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then QS="${QS}&diagnosticId=${DIAGNOSE_DIAGNOSTIC_ID}"; fi
          code=$(curl -sS -o "${DIAGNOSE_OUT}/health-diagnose.json" -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Cache-Control: no-store" \
            "${ATLAS_APP_URL}/api/health/automation-run-diagnose?${QS}" || true)
          echo "health_http=${code}"
          echo "health_http=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = "200" ]; then
            echo "health_ok=1" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json
          d=json.load(open("/home/runner/work/_temp/diagnose-automation-run/health-diagnose.json"))
          print(json.dumps({
            "ok": d.get("ok"),
            "stoppedAt": (d.get("derived") or {}).get("stoppedAt"),
            "hasGoogleCalendarStep": (d.get("automation") or {}).get("hasGoogleCalendarStep"),
            "enabledStepTypes": (d.get("automation") or {}).get("enabledStepTypes"),
            "requiredExternalsDeclared": (d.get("automation") or {}).get("requiredExternalsDeclared"),
            "freeformNotesPreview": (d.get("automation") or {}).get("freeformNotesPreview"),
            "lastErrorMessage": (d.get("run") or {}).get("lastErrorMessage"),
            "runStepCapabilityIds": (d.get("run") or {}).get("runStepCapabilityIds"),
            "externalActionIds": (d.get("run") or {}).get("externalActionIds"),
            "source": (d.get("automation") or {}).get("source"),
            "legacyAutomationId": (d.get("automation") or {}).get("legacyAutomationId"),
          }, ensure_ascii=False, indent=2))
          PY
          else
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            head -c 500 "${DIAGNOSE_OUT}/health-diagnose.json" || true
          fi

      - name: Diagnose automation run from Production DB
        if: steps.health_diagnose.outputs.health_ok != '1'
        env:
          # Prefer workflow_dispatch inputs; push uses the known Production incident ids.
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '93e8885c-1328-4800-9332-3ec2aa1019ef' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '892cb451-62a2-4ea2-9a72-49cab5d67d04' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          if [ -z "${DIAGNOSE_REQUEST_ID:-}${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then
            echo "::error::request_id or diagnostic_id required"
            exit 2
          fi
          node scripts/ci/diagnose-automation-run-production.mjs

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-automation-run
          path: ${{ runner.temp }}/diagnose-automation-run/
          if-no-files-found: warn
