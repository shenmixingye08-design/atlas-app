# Production Automation V2 run diagnostic via DB secrets in Actions.
#
# 2026-08-12: post-#295 「承認して実行」不可は deploy lag（prod=76f5524,
# #295=cb7124c 未反映）。必ず /api/health/version の commitShaShort を先に確認。
name: Diagnose Automation Run Production

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Automation run id (requestId from failure view)
        required: false
        type: string
        default: ""
      diagnostic_id:
        description: diagnosticId from failure view
        required: false
        type: string
        default: ""
  push:
    branches: [main, "cursor/**"]
    paths:
      - "scripts/ci/diagnose-automation-run-production.mjs"
      - "scripts/ci/resolve-preview-deploy-url.mjs"
      - "scripts/ci/print-phase2-diagnose-summary.mjs"
      - ".github/workflows/diagnose-automation-run-production.yml"
      - "app/api/health/automation-run-diagnose/**"
      - "lib/auth/public-routes.ts"

permissions:
  contents: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose via Production health (CRON_SECRET)
        id: health_diagnose
        env:
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          export ATLAS_APP_URL="${ATLAS_APP_URL:-https://atlasapp.jp}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "health_diagnose=skip_no_cron_secret"
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${DIAGNOSE_REQUEST_ID:-}${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then
            QS="force=1"
            if [ -n "${DIAGNOSE_REQUEST_ID:-}" ]; then QS="${QS}&requestId=${DIAGNOSE_REQUEST_ID}"; fi
            if [ -n "${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then QS="${QS}&diagnosticId=${DIAGNOSE_DIAGNOSTIC_ID}"; fi
            PHASE2=0
          else
            QS="force=1&phase2CalendarSuccess=1"
            PHASE2=1
          fi

          # Production first (authoritative DB). Preview optional for newer binary.
          BASES=("${ATLAS_APP_URL}")
          PREVIEW_URL="$(node scripts/ci/resolve-preview-deploy-url.mjs || true)"
          if [ -n "${PREVIEW_URL:-}" ]; then
            echo "preview_url_ready=1"
            BASES+=("${PREVIEW_URL}")
          fi

          health_ok=0
          for BASE in "${BASES[@]}"; do
            echo "diagnose_base=${BASE}"
            code=$(curl -sS -o "${DIAGNOSE_OUT}/health-diagnose.json" -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Cache-Control: no-store" \
              "${BASE}/api/health/automation-run-diagnose?${QS}" || true)
            echo "health_http=${code}"
            echo "health_http=${code}" >> "$GITHUB_OUTPUT"
            if [ "${code}" = "200" ]; then
              health_ok=1
              echo "health_ok=1" >> "$GITHUB_OUTPUT"
              node scripts/ci/print-phase2-diagnose-summary.mjs "${DIAGNOSE_OUT}/health-diagnose.json"
              break
            fi
            head -c 400 "${DIAGNOSE_OUT}/health-diagnose.json" || true
            echo
          done
          if [ "${health_ok}" != "1" ]; then
            echo "health_ok=0" >> "$GITHUB_OUTPUT"
            echo "phase2_mode=${PHASE2}" >> "$GITHUB_OUTPUT"
            head -c 1200 "${DIAGNOSE_OUT}/health-diagnose.json" || true
          fi

      - name: Diagnose automation run from Production DB
        if: steps.health_diagnose.outputs.health_ok != '1'
        env:
          DIAGNOSE_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
          DIAGNOSE_DIAGNOSTIC_ID: ${{ github.event.inputs.diagnostic_id || '' }}
          PHASE2_CALENDAR_SUCCESS: ${{ (github.event.inputs.request_id == '' && github.event.inputs.diagnostic_id == '') && '1' || '' }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-automation-run
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          if [ -z "${DIAGNOSE_REQUEST_ID:-}${DIAGNOSE_DIAGNOSTIC_ID:-}" ]; then
            export PHASE2_CALENDAR_SUCCESS=1
          fi
          node scripts/ci/diagnose-automation-run-production.mjs
          if [ -f "${DIAGNOSE_OUT}/health-diagnose.json" ]; then
            node scripts/ci/print-phase2-diagnose-summary.mjs "${DIAGNOSE_OUT}/health-diagnose.json" || true
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-automation-run
          path: ${{ runner.temp }}/diagnose-automation-run/
          if-no-files-found: warn
