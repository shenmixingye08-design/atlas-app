# One-shot Production work-job diagnostic (redacted evidence).
# Triggered by push when diagnose script/workflow changes, or workflow_dispatch.
name: Diagnose Work Job Production

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Work job UUID to diagnose
        required: true
        type: string
  push:
    branches: [main, "cursor/**"]
    paths:
      - "scripts/ci/diagnose-work-job-production.mjs"
      - ".github/workflows/diagnose-work-job-production.yml"

concurrency:
  group: diagnose-work-job-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose job from Production DB
        env:
          DIAGNOSE_JOB_ID: ${{ github.event.inputs.job_id || '118dce27-2791-4eb8-a62b-8196eef308ae' }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-work-job
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSE_OUT}"
          echo "diagnose_job_id_prefix=$(echo "${DIAGNOSE_JOB_ID}" | cut -c1-8)"
          node scripts/ci/diagnose-work-job-production.mjs

      - name: Upload redacted diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-work-job
          path: ${{ runner.temp }}/diagnose-work-job/
          if-no-files-found: warn
