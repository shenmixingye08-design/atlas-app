# Production work-job diagnostic via E2E Clerk auth → GET /api/work/jobs/:id
# (DB secrets are not available in Actions; Vercel holds Supabase SoT.)
name: Diagnose Work Job Production

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Work job UUID to diagnose
        required: true
        type: string
  push:
    branches: [main, "cursor/**"]
    paths:
      - "scripts/ci/fetch-work-job-via-e2e-auth.mjs"
      - "scripts/ci/diagnose-work-job-production.mjs"
      - ".github/workflows/diagnose-work-job-production.yml"

concurrency:
  group: diagnose-work-job-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch job via E2E Clerk session
        env:
          DIAGNOSE_JOB_ID: ${{ github.event.inputs.job_id || '118dce27-2791-4eb8-a62b-8196eef308ae' }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          DIAGNOSE_OUT: ${{ runner.temp }}/diagnose-work-job
        run: |
          set -euo pipefail
          export ATLAS_APP_URL="${ATLAS_APP_URL:-https://atlasapp.jp}"
          if [ -z "${CLERK_PUBLISHABLE_KEY:-}" ] && [ -n "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            export CLERK_PUBLISHABLE_KEY="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
          fi
          mkdir -p "${DIAGNOSE_OUT}"
          echo "diagnose_job_id_prefix=$(echo "${DIAGNOSE_JOB_ID}" | cut -c1-8)"
          node scripts/ci/fetch-work-job-via-e2e-auth.mjs

      - name: Upload redacted diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-work-job
          path: ${{ runner.temp }}/diagnose-work-job/
          if-no-files-found: warn
