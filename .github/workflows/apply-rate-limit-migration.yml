name: Apply Distributed Rate Limit Migration (P1-06)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260809_p1_06_distributed_rate_limit.sql"
      - "lib/rate-limit/migration-sql.ts"
      - ".github/workflows/apply-rate-limit-migration.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P1-06 distributed rate limit SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          SQL_FILES=(
            "supabase/migrations/20260809_p1_06_distributed_rate_limit.sql"
            "supabase/migrations/20260809_p1_06_rate_limit_rpc_returns_table.sql"
          )

          apply_psql() {
            echo "Applying via psql: $1"
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$1"
          }

          apply_management() {
            local file="$1"
            BODY=$(python3 - <<PY
          import json, pathlib
          sql = pathlib.Path("$file").read_text()
          print(json.dumps({"query": sql}))
          PY
          )
            RESP=$(curl -sS -w "\n%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            CODE=$(echo "$RESP" | tail -n1)
            BODY_OUT=$(echo "$RESP" | sed '$d')
            BYTES=$(printf '%s' "$BODY_OUT" | wc -c | tr -d ' ')
            echo "management_api_status=$CODE body_bytes=$BYTES file=$file"
            test "$CODE" = "200" -o "$CODE" = "201"
          }

          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${SUPABASE_DB_URL:-}" ]; then
            CONN="${DATABASE_URL:-${POSTGRES_URL:-$SUPABASE_DB_URL}}"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            for SQL_FILE in "${SQL_FILES[@]}"; do
              apply_psql "$SQL_FILE"
            done
            echo "Applied distributed rate limit schema via psql"
            exit 0
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::P1-06: rate limit DDL credentials missing."
            echo "::error::Set GitHub Actions secrets DATABASE_URL (or POSTGRES_URL) OR SUPABASE_ACCESS_TOKEN+SUPABASE_PROJECT_REF,"
            echo "::error::OR apply these files in order in Supabase SQL Editor:"
            echo "::error::1) supabase/migrations/20260809_p1_06_distributed_rate_limit.sql"
            echo "::error::2) supabase/migrations/20260809_p1_06_rate_limit_rpc_returns_table.sql"
            echo "::error::then confirm https://atlasapp.jp/api/health/rate-limit shows ok=true."
            exit 1
          fi

          for SQL_FILE in "${SQL_FILES[@]}"; do
            apply_management "$SQL_FILE"
          done
          echo "Applied distributed rate limit schema via Management API"
