# N-05 Production Personal Memory apply proof.
name: Verify Memory Apply Production (N-05)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/memory-apply/**"
      - "lib/personal-memory/**"
      - "lib/automations/run-automation.ts"
      - "lib/persistence/durable-domain.ts"
      - "app/api/health/memory-apply/**"
      - "scripts/ci/n05-memory-apply-ban.mjs"
      - ".github/workflows/verify-memory-apply-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production memory-apply
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"
          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          READY=""
          for i in $(seq 1 40); do
            curl -sS -o /tmp/n05.json "${PROD_URL}/api/health/memory-apply?force=1" || true
            PROD_SHA="$(python3 -c 'import json;d=json.load(open("/tmp/n05.json"));print(d.get("commitShaShort") or "")' 2>/dev/null || true)"
            OK="$(python3 -c 'import json;d=json.load(open("/tmp/n05.json"));print(d.get("ok"))' 2>/dev/null || true)"
            ERR="$(python3 -c 'import json;d=json.load(open("/tmp/n05.json"));print(d.get("error") or "")' 2>/dev/null || true)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA} ok=${OK} error=${ERR}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ] && [ "${OK}" = "True" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ] && [ "${OK}" = "True" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            sleep 15
          done
          if [ -z "${READY}" ]; then
            echo "::error::Production memory-apply not ready. Soft-success forbidden."
            exit 1
          fi

          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/n05.json"))
          true_keys=(
            "ok","dbSotOk","saveRetrieveOk","memoryAppliedOk",
            "artifactPreferenceAppliedOk","automationPreferenceAppliedOk",
            "restartDurableOk","multiInstanceOk","ownershipIsolationOk",
            "deletePropagationOk","updatePropagationOk","secretsRedacted",
            "failClosedOk","memorySaved","memoryRetrieved","memoryApplied","failClosed",
          )
          false_keys=("crossUserMemoryLeak",)
          print({k:d.get(k) for k in true_keys+false_keys})
          failures=[]
          for k in true_keys:
            if d.get(k) is not True:
              failures.append(f"{k}!=true")
          for k in false_keys:
            if d.get(k) is not False:
              failures.append(f"{k}!=false")
          if failures:
            print("::error::N-05 Production memory-apply failed:", ", ".join(failures))
            sys.exit(1)
          print("n05_production_memory_apply=pass")
          PY
