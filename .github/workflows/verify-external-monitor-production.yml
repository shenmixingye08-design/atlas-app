# P1-07 Production external monitor proof.
# GitHub Actions UI name: "Verify External Monitor Production (P1-07)"
# Find it: Actions → All workflows → search "P1-07" or "External Monitor"
# Manual run: Run workflow → branch main
name: Verify External Monitor Production (P1-07)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this Production smoke is being run"
        required: false
        default: "P1-07 Owner notify proof"
  push:
    branches: [main]
    paths:
      - "lib/external-monitor/**"
      - "app/api/automations/tick/**"
      - "app/api/health/external-monitor/**"
      - ".github/workflows/verify-external-monitor-production.yml"

permissions:
  contents: read

jobs:
  verify-production-smoke:
    name: Production smoke (Owner notify + recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call Production external-monitor smoke
        env:
          PROD_URL: https://atlasapp.jp
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is missing."
            echo "::error::Set repository secret CRON_SECRET to the same value as Vercel Production CRON_SECRET."
            exit 1
          fi

          # Never print CRON_SECRET / Authorization header / raw bearer token.
          echo "Calling Production external-monitor smoke (secret redacted)"
          echo "URL=${PROD_URL}/api/health/external-monitor?force=1&smoke=1"

          HTTP_CODE=$(curl -sS -o /tmp/p107-smoke.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${PROD_URL}/api/health/external-monitor?force=1&smoke=1")

          echo "http_status=${HTTP_CODE}"
          BYTES=$(wc -c < /tmp/p107-smoke.json | tr -d ' ')
          echo "body_bytes=${BYTES}"

          case "${HTTP_CODE}" in
            2*) ;;
            *)
              echo "::error::Production smoke HTTP ${HTTP_CODE} (non-2xx). Soft-success forbidden."
              python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/p107-smoke.json"))
            # Safe keys only — never dump secrets.
            print({k:d.get(k) for k in [
              "ok","smokeOk","error","ownerHint","commitShaShort","status"
            ]})
          except Exception as e:
            print("body_parse_failed", type(e).__name__)
          PY
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import json,sys

          d=json.load(open("/tmp/p107-smoke.json"))
          ev=d.get("smokeEvidence") or {}
          summary={
            "ok": d.get("ok"),
            "smokeOk": d.get("smokeOk"),
            "commitShaShort": d.get("commitShaShort"),
            "error": d.get("error"),
            "incidentId": ev.get("incidentId"),
            "deliveryStatus": ev.get("deliveryStatus"),
            "recoveryDeliveryStatus": ev.get("recoveryDeliveryStatus"),
            "ownerNotifyPath": ev.get("ownerNotifyPath"),
            "detectedAt": ev.get("detectedAt"),
            "recoveryAt": ev.get("recoveryAt"),
            "lineConfigured": ev.get("lineConfigured"),
          }
          print(summary)

          failures=[]
          if d.get("ok") is not True:
            failures.append("ok!=true")
          if d.get("smokeOk") is not True:
            failures.append("smokeOk!=true")
          if not ev.get("incidentId"):
            failures.append("incidentId missing")
          if ev.get("deliveryStatus") != "sent":
            failures.append("deliveryStatus!=sent")
          if ev.get("recoveryDeliveryStatus") not in ("sent", "skipped"):
            # recovery notify must be claimed; skipped only if single-winner already delivered
            failures.append("recoveryDeliveryStatus invalid")
          if ev.get("ownerNotifyPath") not in ("line", "system"):
            failures.append("ownerNotifyPath not proven")
          if not ev.get("detectedAt"):
            failures.append("detectedAt missing")
          if not ev.get("recoveryAt"):
            failures.append("recoveryAt missing")

          if failures:
            print("::error::P1-07 Production smoke failed:", ", ".join(failures))
            sys.exit(1)

          print("p1_07_production_smoke=pass")
          PY
