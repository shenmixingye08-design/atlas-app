# P1-07 Production external monitor proof.
# GitHub Actions UI name: "Verify External Monitor Production (P1-07)"
# Find it: Actions → All workflows → search "P1-07" or "External Monitor"
# Manual run: Run workflow → branch main
name: Verify External Monitor Production (P1-07)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this Production smoke is being run"
        required: false
        default: "P1-07 Owner notify proof"
  push:
    branches: [main]
    paths:
      - "lib/external-monitor/**"
      - "app/api/automations/tick/**"
      - "app/api/health/external-monitor/**"
      - ".github/workflows/verify-external-monitor-production.yml"

permissions:
  contents: read

jobs:
  verify-production-smoke:
    name: Production smoke (Owner notify + recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Call Production external-monitor smoke
        env:
          PROD_URL: https://atlasapp.jp
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATLAS_APP_URL: ${{ secrets.ATLAS_APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is missing."
            echo "::error::Set repository secret CRON_SECRET to the same value as Vercel Production CRON_SECRET."
            exit 1
          fi

          # Presence-only checks — never print secret values.
          echo "CRON_SECRET_present=true"
          if [ -n "${ATLAS_APP_URL:-}" ]; then
            echo "ATLAS_APP_URL_present=true"
          else
            echo "ATLAS_APP_URL_present=false (PROD_URL hardcoded fallback in use)"
          fi

          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"

          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          echo "Waiting for Production deploy readiness (max ~6m)..."
          DEPLOYED=""
          PROD_SHA=""
          for i in $(seq 1 24); do
            curl -sS -o /tmp/p107-probe.json "${PROD_URL}/api/health/external-monitor" || true
            PROD_SHA="$(python3 - <<'PY'
import json
try:
  d=json.load(open("/tmp/p107-probe.json"))
  print(d.get("commitShaShort") or "")
except Exception:
  print("")
PY
)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA}"
            if [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ]; then
              DEPLOYED=1
              break
            fi
            # Workflow-only pushes do not create a new Vercel Production deploy.
            # Smoke the already-live Production SHA once the probe is healthy.
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ]; then
              READY="$(python3 - <<'PY'
import json
try:
  d=json.load(open("/tmp/p107-probe.json"))
  print("1" if d.get("durableReady") and d.get("tickWired") else "0")
except Exception:
  print("0")
PY
)"
              if [ "${READY}" = "1" ]; then
                echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
                DEPLOYED=1
                break
              fi
            fi
            sleep 15
          done
          if [ -z "${DEPLOYED}" ]; then
            echo "::error::Production deploy not ready after wait (got ${PROD_SHA:-unknown}, expected ${EXPECTED_SHA_SHORT}). Soft-success forbidden."
            exit 1
          fi

          # Never print CRON_SECRET / Authorization header / raw bearer token.
          echo "Calling Production external-monitor smoke (secret redacted)"
          echo "URL=${PROD_URL}/api/health/external-monitor?force=1&smoke=1"

          HTTP_CODE=$(curl -sS -o /tmp/p107-smoke.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${PROD_URL}/api/health/external-monitor?force=1&smoke=1")

          echo "http_status=${HTTP_CODE}"
          BYTES=$(wc -c < /tmp/p107-smoke.json | tr -d ' ')
          echo "body_bytes=${BYTES}"

          case "${HTTP_CODE}" in
            2*) ;;
            *)
              echo "::error::Production smoke HTTP ${HTTP_CODE} (non-2xx). Soft-success forbidden."
              python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/p107-smoke.json"))
            ev=d.get("smokeEvidence") or {}
            # Safe keys only — never dump secrets.
            print({
              "ok": d.get("ok"),
              "smokeOk": d.get("smokeOk"),
              "error": d.get("error"),
              "ownerHint": d.get("ownerHint"),
              "commitShaShort": d.get("commitShaShort"),
              "status": d.get("status"),
              "smokeEvidence": {
                k: ev.get(k) for k in [
                  "incidentId","deliveryStatus","recoveryDeliveryStatus",
                  "ownerNotifyPath","postClearTickStatus",
                  "incidentStatusAfterRecovery","tickReestablishHttpStatus",
                  "tickReestablishOk","tickReestablishErrorCode",
                  "localHeartbeatStamped","resolvedThisCycle","lineConfigured",
                  "detectedAt","recoveryAt"
                ]
              },
            })
          except Exception as e:
            print("body_parse_failed", type(e).__name__)
          PY
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import json,sys

          d=json.load(open("/tmp/p107-smoke.json"))
          ev=d.get("smokeEvidence") or {}
          summary={
            "ok": d.get("ok"),
            "smokeOk": d.get("smokeOk"),
            "commitShaShort": d.get("commitShaShort"),
            "error": d.get("error"),
            "incidentId": ev.get("incidentId"),
            "deliveryStatus": ev.get("deliveryStatus"),
            "recoveryDeliveryStatus": ev.get("recoveryDeliveryStatus"),
            "ownerNotifyPath": ev.get("ownerNotifyPath"),
            "detectedAt": ev.get("detectedAt"),
            "recoveryAt": ev.get("recoveryAt"),
            "lineConfigured": ev.get("lineConfigured"),
            "tickReestablishHttpStatus": ev.get("tickReestablishHttpStatus"),
            "tickReestablishErrorCode": ev.get("tickReestablishErrorCode"),
            "localHeartbeatStamped": ev.get("localHeartbeatStamped"),
          }
          print(summary)

          failures=[]
          if d.get("ok") is not True:
            failures.append("ok!=true")
          if d.get("smokeOk") is not True:
            failures.append("smokeOk!=true")
          if not ev.get("incidentId"):
            failures.append("incidentId missing")
          if ev.get("deliveryStatus") != "sent":
            failures.append("deliveryStatus!=sent")
          if ev.get("recoveryDeliveryStatus") not in ("sent", "skipped"):
            # recovery notify must be claimed; skipped only if single-winner already delivered
            failures.append("recoveryDeliveryStatus invalid")
          if ev.get("ownerNotifyPath") not in ("line", "system"):
            failures.append("ownerNotifyPath not proven")
          if not ev.get("detectedAt"):
            failures.append("detectedAt missing")
          if not ev.get("recoveryAt"):
            failures.append("recoveryAt missing")

          if failures:
            print("::error::P1-07 Production smoke failed:", ", ".join(failures))
            sys.exit(1)

          print("p1_07_production_smoke=pass")
          PY
