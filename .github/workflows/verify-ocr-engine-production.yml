# P2-05 Production OCR dedicated-engine evaluation proof.
name: Verify OCR Engine Production (P2-05)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/ocr-engine/**"
      - "lib/automation-platform/execution/vision-step.ts"
      - "app/api/health/ocr-engine/**"
      - "scripts/ci/p2-05-ocr-engine-ban.mjs"
      - "supabase/migrations/20260809_p2_05_ocr_engine_evaluations.sql"
      - ".github/workflows/verify-ocr-engine-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production ocr-engine
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"
          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          READY=""
          for i in $(seq 1 40); do
            curl -sS -o /tmp/p205.json "${PROD_URL}/api/health/ocr-engine?force=1" || true
            PROD_SHA="$(python3 -c 'import json;d=json.load(open("/tmp/p205.json"));print(d.get("commitShaShort") or "")' 2>/dev/null || true)"
            OK="$(python3 -c 'import json;d=json.load(open("/tmp/p205.json"));print(d.get("ok"))' 2>/dev/null || true)"
            ERR="$(python3 -c 'import json;d=json.load(open("/tmp/p205.json"));print(d.get("error") or "")' 2>/dev/null || true)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA} ok=${OK} error=${ERR}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ] && [ "${OK}" = "True" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ] && [ "${OK}" = "True" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            sleep 15
          done
          if [ -z "${READY}" ]; then
            echo "::error::Production ocr-engine not ready. Soft-success forbidden."
            exit 1
          fi

          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/p205.json"))
          print({k:d.get(k) for k in [
            "ok","evaluationComplete","visionOcrPathPresent","accuracyGateOk",
            "dedicatedEngineRequired","dedicatedEnginePolicyOk",
            "restartDurableOk","retrySafe","multiInstanceSafe","memoryNotSot",
            "ownershipIsolationOk","secretsRedacted","tableOk",
            "failClosedOnMissingProvider","commitShaShort","error"
          ]})
          failures=[]
          for k in ("ok","evaluationComplete","visionOcrPathPresent","accuracyGateOk",
                    "dedicatedEnginePolicyOk","restartDurableOk","retrySafe",
                    "multiInstanceSafe","memoryNotSot","ownershipIsolationOk",
                    "secretsRedacted","tableOk","failClosedOnMissingProvider"):
            if d.get(k) is not True:
              failures.append(f"{k}!=true")
          # dedicatedEngineRequired is a factual outcome — do not force true/false.
          if "dedicatedEngineRequired" not in d:
            failures.append("dedicatedEngineRequired_missing")
          if failures:
            print("::error::P2-05 Production ocr-engine failed:", ", ".join(failures))
            sys.exit(1)
          print("p2_05_production_ocr_engine=pass")
          PY
