name: Apply OAuth Encryption Migration (P0-02)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260808_p0_02_oauth_token_encryption.sql"
      - "lib/integrations/oauth-crypto/migration-sql.ts"
      - ".github/workflows/apply-oauth-encryption-migration.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P0-02 OAuth encryption SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          SQL_FILE="supabase/migrations/20260808_p0_02_oauth_token_encryption.sql"
          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${SUPABASE_DB_URL:-}" ]; then
            CONN="${DATABASE_URL:-${POSTGRES_URL:-$SUPABASE_DB_URL}}"
            echo "Applying via psql connection string (no token values logged)"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
            echo "Applied via psql"
            exit 0
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::No DATABASE_URL/POSTGRES_URL and no SUPABASE_ACCESS_TOKEN+SUPABASE_PROJECT_REF — Actions could not apply DDL. If you already applied supabase/migrations/20260808_p0_02_oauth_token_encryption.sql in Supabase SQL Editor, this is OK. Confirm via /api/health/oauth-encryption."
            exit 0
          fi
          BODY=$(python3 - <<'PY'
          import json, pathlib
          sql = pathlib.Path("supabase/migrations/20260808_p0_02_oauth_token_encryption.sql").read_text()
          print(json.dumps({"query": sql}))
          PY
          )
          RESP=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          # P0-04: never echo Management API body (may include SQL errors / metadata).
          BYTES=$(printf '%s' "$BODY_OUT" | wc -c | tr -d ' ')
          echo "management_api_status=$CODE"
          echo "management_api_body_bytes=$BYTES"
          test "$CODE" = "200" -o "$CODE" = "201"
