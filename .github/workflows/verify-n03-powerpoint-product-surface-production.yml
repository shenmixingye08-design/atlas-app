# N-03 Production PowerPoint product surface proof.
name: Verify N-03 PowerPoint Product Surface Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/deliverables/**"
      - "lib/landing/**"
      - "lib/workspace/**"
      - "lib/home/**"
      - "components/home/**"
      - "components/workspace/**"
      - "components/landing/**"
      - "public/samples/**"
      - "app/api/health/n03-powerpoint-product-surface/**"
      - "scripts/ci/n03-powerpoint-product-surface-ban.mjs"
      - ".github/workflows/verify-n03-powerpoint-product-surface-production.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Production N-03 PowerPoint product surface
        env:
          PROD_URL: https://atlasapp.jp
        run: |
          set -euo pipefail
          EXPECTED_SHA_SHORT="$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)"
          echo "expected_commit_sha_short=${EXPECTED_SHA_SHORT}"
          APP_CODE_CHANGED=0
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^(lib/|app/|components/|public/)' >/dev/null 2>&1; then
              APP_CODE_CHANGED=1
            fi
          else
            APP_CODE_CHANGED=1
          fi
          echo "app_code_changed=${APP_CODE_CHANGED}"

          READY=""
          for i in $(seq 1 40); do
            curl -sS -o /tmp/n03.json "${PROD_URL}/api/health/n03-powerpoint-product-surface?force=1" || true
            PROD_SHA="$(python3 -c 'import json;d=json.load(open("/tmp/n03.json"));print(d.get("commitShaShort") or "")' 2>/dev/null || true)"
            OK="$(python3 -c 'import json;d=json.load(open("/tmp/n03.json"));print(d.get("ok"))' 2>/dev/null || true)"
            ERR="$(python3 -c 'import json;d=json.load(open("/tmp/n03.json"));print(d.get("error") or "")' 2>/dev/null || true)"
            echo "probe=${i} production_commit_sha_short=${PROD_SHA} ok=${OK} error=${ERR}"
            if [ -n "${EXPECTED_SHA_SHORT}" ] && [ "${PROD_SHA}" = "${EXPECTED_SHA_SHORT}" ] && [ "${OK}" = "True" ]; then
              READY=1
              break
            fi
            if [ "${APP_CODE_CHANGED}" = "0" ] && [ -n "${PROD_SHA}" ] && [ "${OK}" = "True" ]; then
              echo "workflow_only_change=true smoking_live_production_sha=${PROD_SHA}"
              READY=1
              break
            fi
            sleep 15
          done
          if [ -z "${READY}" ]; then
            echo "::error::Production N-03 PowerPoint product surface not ready."
            exit 1
          fi

          python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/n03.json"))
          true_keys=(
            "ok","powerpointCapabilityOk","powerpointRoutingOk","pptxGenerationOk",
            "pptxMimeOk","pptxDownloadOk","artifactPersistenceOk","mobileExposureOk",
            "failClosedOk","crossUserIsolatedOk","secretsRedactedOk",
          )
          print({k:d.get(k) for k in true_keys})
          failures=[]
          for k in true_keys:
            if d.get(k) is not True:
              failures.append(f"{k}!=true")
          if failures:
            print("::error::N-03 Production PowerPoint product surface failed:", ", ".join(failures))
            sys.exit(1)
          print("n03_production_powerpoint_product_surface=pass")
          PY
