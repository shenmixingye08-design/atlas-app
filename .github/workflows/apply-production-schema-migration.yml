name: Apply Production Automation Schema

# Prefer Production apply=1 with CRON_SECRET (Vercel already has DATABASE_URL).
# Creates / repairs atlas_deliverable_files and sibling automation objects.
# Additive only — existing rows stay untouched.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260822_prod_automation_schema_ensure.sql"
      - "lib/health/production-schema-migration-sql.ts"
      - "lib/health/production-schema-probe.ts"
      - "lib/health/schema-compatibility.ts"
      - "app/api/health/production-schema/**"
      - ".github/workflows/apply-production-schema-migration.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production automation schema (Production apply=1 preferred)
        env:
          PROD_URL: https://atlasapp.jp
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          probe_ok() {
            CODE=$(curl -sS -o /tmp/schema-probe.json -w "%{http_code}" \
              "$PROD_URL/api/health/production-schema?force=1" || echo "000")
            echo "probe_http=$CODE"
            python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/schema-probe.json"))
          print({k:d.get(k) for k in [
            "ok","deliverableFilesOk","automationJobsOk","xAutopostSettingsOk",
            "claimXPostJobsOk","schemaErrorCount","dbSchemaCompatibility",
            "deliverableFilesCompatibility","commitShaShort"
          ]})
          sys.exit(0 if d.get("ok") is True and d.get("deliverableFilesOk") is True else 1)
          PY
          }

          SQL_FILE="supabase/migrations/20260822_prod_automation_schema_ensure.sql"

          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Attempting Production apply=1 with CRON_SECRET"
            APPLY_CODE=$(curl -sS -o /tmp/schema-apply.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$PROD_URL/api/health/production-schema?force=1&apply=1" || echo "000")
            echo "apply_http=$APPLY_CODE"
            python3 - <<'PY'
          import json
          try:
            d=json.load(open("/tmp/schema-apply.json"))
            print({k:d.get(k) for k in [
              "ok","deliverableFilesOk","automationJobsOk","xAutopostSettingsOk",
              "claimXPostJobsOk","schemaErrorCount","dbSchemaCompatibility",
              "commitShaShort"
            ]})
          except Exception as e:
            print("apply_parse", e)
          PY
            case "$APPLY_CODE" in
              200|202|204)
                if probe_ok; then
                  echo "production_schema_ready_via_production_apply=true"
                  exit 0
                fi
                ;;
            esac
          else
            echo "::warning::CRON_SECRET not set — cannot call Production apply=1"
          fi

          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${SUPABASE_DB_URL:-}" ]; then
            CONN="${DATABASE_URL:-${POSTGRES_URL:-$SUPABASE_DB_URL}}"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            echo "Applying via psql: $SQL_FILE"
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
            sleep 2
            if probe_ok; then
              echo "production_schema_ready_via_psql=true"
              exit 0
            fi
          fi

          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            BODY=$(python3 - <<PY
          import json, pathlib
          print(json.dumps({"query": pathlib.Path("$SQL_FILE").read_text()}))
          PY
          )
            RESP=$(curl -sS -w "\n%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            CODE=$(echo "$RESP" | tail -n1)
            echo "management_api_status=$CODE"
            test "$CODE" = "200" -o "$CODE" = "201"
            sleep 2
            if probe_ok; then
              echo "production_schema_ready_via_management_api=true"
              exit 0
            fi
          fi

          if probe_ok; then
            echo "production_schema_already_healthy=true"
            exit 0
          fi

          echo "::error::Production automation schema still missing after apply attempts."
          echo "::error::Owner: run Supabase SQL Editor (20260822_prod_automation_schema_ensure.sql) OR"
          echo "::error::curl -H \"Authorization: Bearer \$CRON_SECRET\" \"https://atlasapp.jp/api/health/production-schema?apply=1&force=1\""
          exit 1
